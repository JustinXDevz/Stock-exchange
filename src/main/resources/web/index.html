<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bursa Saham</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#262c36;--tx:#e8ecf2;--mu:#8b95a5;--up:#2ecc71;--dn:#ff5c5c;--ac:#f5b942;--chip:#1f2530}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--card:#fff;--line:#e2e6ec;--tx:#171b22;--mu:#667085;--up:#14a45a;--dn:#d93838;--ac:#c98a0b;--chip:#eef1f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1;min-width:140px}
.live{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dn)}
.dot.on{background:var(--up);box-shadow:0 0 0 0 var(--up);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.badge{background:var(--dn);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
main{max-width:980px;margin:0 auto;padding:14px 16px 40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;background:var(--chip);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;min-width:108px}
.chip.sel{border-color:var(--ac)}
.chip b{display:block;font-size:13px}
.chip small{color:var(--mu)}
.bar{display:flex;gap:8px;margin:12px 0}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
input{flex:1;min-width:0}
.row{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.row:hover{border-color:var(--ac)}
.tk{font-weight:700}
.nm{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--mu);margin-left:6px}
.tag.ipo{color:#b983ff}
.px{text-align:right}
.px b{display:block;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--mu)}
.row.flup{animation:fu .9s}.row.fldn{animation:fd .9s}
@keyframes fu{from{background:rgba(46,204,113,.25)}}
@keyframes fd{from{background:rgba(255,92,92,.25)}}
svg.sp{width:64px;height:28px}
.empty{color:var(--mu);text-align:center;padding:30px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px}
section.card h2{font-size:15px;margin:0 0 8px}
.news div{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.news div:first-of-type{border-top:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;border:1px solid var(--line);padding:16px}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh h3{margin:0;font-size:20px}
.x{background:var(--chip);border:0;color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:16px}
.big{font-size:28px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin:10px 0}
.tab{background:var(--chip);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}
.tab.sel{border-color:var(--ac)}
canvas{width:100%;height:240px;display:block;touch-action:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--mu);font-size:12px}
.prog{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:#b983ff}
footer{color:var(--mu);font-size:12px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<header>
  <h1 id="title">Bursa Saham</h1>
  <span id="frozen" class="badge" hidden>Bursa dibekukan</span>
  <span class="live"><span id="dot" class="dot"></span><span id="status">menghubungkan…</span></span>
</header>
<main>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Cari ticker / nama…" autocomplete="off">
    <select id="sort">
      <option value="ticker">Ticker A–Z</option>
      <option value="chg_desc">Naik terbesar</option>
      <option value="chg_asc">Turun terbesar</option>
      <option value="price_desc">Harga tertinggi</option>
    </select>
  </div>
  <div id="list"></div>
  <section class="card" id="newsBox" hidden><h2>Berita Pasar</h2><div class="news" id="news"></div></section>
  <section class="card" id="topBox" hidden><h2>Top Investor</h2><div class="news" id="top"></div></section>
  <footer id="foot"></footer>
</main>

<div class="ov" id="ov">
  <div class="sheet">
    <div class="sh"><div><h3 id="dT"></h3><div class="nm" id="dN"></div></div><button class="x" id="dX" aria-label="Tutup">✕</button></div>
    <div class="big" id="dP"></div>
    <div id="dC"></div>
    <div class="tabs"><button class="tab sel" data-r="live">Live</button><button class="tab" data-r="long">Riwayat</button></div>
    <canvas id="cv"></canvas>
    <div class="nm" id="cvInfo" style="margin-top:6px"></div>
    <div class="kv" id="dKV"></div>
    <div id="dDesc" class="nm" style="margin-top:10px;white-space:normal"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const st={data:null,sector:'all',q:'',sort:'ticker',open:null,range:'live',detail:null,prev:{}};
let cur='$',pollMs=3000,timer=null;

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function money(v){return cur+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pct(v){const a=Math.abs(v);if(a<0.005)return{t:'– 0.00%',c:'fl'};return{t:(v>0?'▲ ':'▼ ')+a.toFixed(2)+'%',c:v>0?'up':'dn'}}
function spark(pts,up){
  const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.setAttribute('class','sp');s.setAttribute('viewBox','0 0 64 28');
  if(pts.length>1){const mn=Math.min(...pts),mx=Math.max(...pts),r=mx-mn||1;
    const p=pts.map((v,i)=>(i*(64/(pts.length-1))).toFixed(1)+','+(26-((v-mn)/r)*24).toFixed(1)).join(' ');
    const l=document.createElementNS(ns,'polyline');l.setAttribute('points',p);l.setAttribute('fill','none');l.setAttribute('stroke-width','2');
    l.setAttribute('stroke',up?'var(--up)':'var(--dn)');s.appendChild(l)}
  return s}

function render(){
  const d=st.data;if(!d)return;
  cur=d.currency||'$';
  document.title=d.title;$('#title').textContent=d.title;
  $('#frozen').hidden=!d.frozen;
  // chips
  const chips=$('#chips');chips.textContent='';
  const total=d.stocks.length;
  const mk=(id,name,sub,cls)=>{const b=el('button','chip'+(st.sector===id?' sel':''));b.appendChild(el('b',null,name));
    const s=el('small',cls||'',sub);b.appendChild(s);b.onclick=()=>{st.sector=id;render()};chips.appendChild(b)};
  mk('all','Semua',total+' saham');
  d.sectors.forEach(s=>{const p=pct(s.a);mk(s.id,s.n,s.c?s.c+' saham · '+p.t:'0 saham',s.c?p.c:'')});
  // list
  let rows=d.stocks.filter(x=>(st.sector==='all'||x.s===st.sector)&&(!st.q||(x.t+' '+x.n).toLowerCase().includes(st.q)));
  const by={ticker:(a,b)=>a.t.localeCompare(b.t),chg_desc:(a,b)=>b.c-a.c,chg_asc:(a,b)=>a.c-b.c,price_desc:(a,b)=>b.p-a.p};
  rows.sort(by[st.sort]);
  const list=$('#list');list.textContent='';
  if(!rows.length)list.appendChild(el('div','empty','Tidak ada saham.'));
  const secName={};d.sectors.forEach(s=>secName[s.id]=s.n);
  rows.forEach(x=>{
    const r=el('div','row');
    const left=el('div');const t=el('div','tk',x.t);
    t.appendChild(el('span','tag',secName[x.s]||x.s));
    if(x.st==='IPO')t.appendChild(el('span','tag ipo','IPO'));
    left.appendChild(t);left.appendChild(el('div','nm',x.n));
    const mid=el('div','px');mid.appendChild(el('b',null,money(x.p)));
    if(x.st==='IPO'){mid.appendChild(el('span','fl',x.ipoSold+'/'+x.ipoOffered+' terjual'))}
    else{const p=pct(x.c);mid.appendChild(el('span',p.c,p.t))}
    r.appendChild(left);r.appendChild(mid);
    r.appendChild(x.st==='IPO'?el('div'):spark(x.sp,x.c>=0));
    const pv=st.prev[x.t];if(pv!==undefined&&pv!==x.p)r.classList.add(x.p>pv?'flup':'fldn');
    st.prev[x.t]=x.p;
    r.onclick=()=>openDetail(x);
    list.appendChild(r)});
  // news / top
  $('#newsBox').hidden=!d.news.length;const nb=$('#news');nb.textContent='';d.news.forEach(n=>nb.appendChild(el('div',null,n)));
  $('#topBox').hidden=!(d.top&&d.top.length);
  if(d.top){const tb=$('#top');tb.textContent='';d.top.forEach((p,i)=>tb.appendChild(el('div',null,'#'+(i+1)+'  '+p.n+' — '+money(p.v))))}
  $('#foot').textContent='Diperbarui '+new Date(d.ts).toLocaleTimeString()+' · harga bergerak karena transaksi pemain, event, dan aktivitas shop';
  pollMs=Math.max(2,d.refreshSec||3)*1000;
}

function live(on){$('#dot').className='dot'+(on?' on':'');$('#status').textContent=on?'LIVE':'terputus'}
async function poll(){
  if(!document.hidden){
    try{const r=await fetch('/api/snapshot',{cache:'no-store'});if(!r.ok)throw 0;
      st.data=await r.json();live(true);render();if(st.open)loadDetail();}
    catch(e){live(false)}
  }
  timer=setTimeout(poll,pollMs)}

// ---- detail ----
function openDetail(x){
  st.open=x.t;st.detail=null;
  $('#dT').textContent=x.t;$('#dN').textContent=x.n;$('#dP').textContent=money(x.p);
  $('#dC').textContent='';$('#dKV').textContent='';$('#dDesc').textContent='';$('#cvInfo').textContent='';
  $('#ov').classList.add('show');
  if(x.st==='IPO'){showIpo(x);return}
  loadDetail()}
function showIpo(x){
  const kv=$('#dKV');kv.textContent='';
  const add=(k,v)=>{const d=el('div');d.appendChild(el('small',null,k));d.appendChild(el('b',null,v));kv.appendChild(d)};
  add('Harga IPO',money(x.p));add('Terjual',x.ipoSold+' / '+x.ipoOffered);
  const left=Math.max(0,x.ipoEnd-Date.now());add('Berakhir dalam',Math.floor(left/3600000)+' jam '+Math.floor(left%3600000/60000)+' menit');
  add('Pemilik',x.owner);
  const p=el('div','prog');const i=el('i');i.style.width=Math.min(100,100*x.ipoSold/Math.max(1,x.ipoOffered))+'%';p.appendChild(i);$('#dDesc').textContent='';$('#dDesc').appendChild(p);
  clearCanvas()}
async function loadDetail(){
  const t=st.open;if(!t)return;
  const x=st.data&&st.data.stocks.find(s=>s.t===t);if(!x)return;
  if(x.st==='IPO'){showIpo(x);return}
  try{const r=await fetch('/api/stock/'+encodeURIComponent(t),{cache:'no-store'});if(!r.ok)return;
    if(st.open!==t)return;st.detail=await r.json();paintDetail()}catch(e){}}
function paintDetail(){
  const d=st.detail;if(!d)return;
  $('#dP').textContent=money(d.p);
  const p=pct(d.c);const c=$('#dC');c.textContent='';c.appendChild(el('span',p.c,p.t+' (24 jam)'));
  const kv=$('#dKV');kv.textContent='';
  const add=(k,v)=>{const e=el('div');e.appendChild(el('small',null,k));e.appendChild(el('b',null,v));kv.appendChild(e)};
  add('Sektor',d.s);add('Harga buka 24j',money(d.o));add('Tersedia di pasar',d.pool+' / '+d.total);add('Pemegang saham',String(d.holders));
  add('Pemilik',d.owner);if(d.treasury!==undefined)add('Kas perusahaan',money(d.treasury));
  $('#dDesc').textContent=d.desc||'';
  drawChart()}
function series(){const d=st.detail;if(!d)return{v:[],step:1};return st.range==='live'?{v:d.l,step:d.ls}:{v:d.h,step:d.hs}}
function clearCanvas(){const cv=$('#cv');const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height)}
function drawChart(hover){
  const cv=$('#cv'),dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  const s=series(),v=s.v;const cs=getComputedStyle(document.body);
  if(v.length<2){g.fillStyle=cs.color;g.globalAlpha=.6;g.font='14px system-ui';g.fillText('Data belum cukup, tunggu beberapa saat…',12,28);g.globalAlpha=1;$('#cvInfo').textContent='';return}
  let mn=Math.min(...v),mx=Math.max(...v);if(mx-mn<1e-9){mn-=1;mx+=1}const pad=(mx-mn)*.1;mn-=pad;mx+=pad;
  const L=8,R=60,T=10,B=18,W=w-L-R,H=h-T-B;
  const X=i=>L+i*W/(v.length-1),Y=x=>T+H-(x-mn)/(mx-mn)*H;
  const up=v[v.length-1]>=v[0];const col=getComputedStyle(document.documentElement).getPropertyValue(up?'--up':'--dn').trim();
  g.strokeStyle='rgba(128,138,155,.25)';g.lineWidth=1;g.fillStyle='rgba(128,138,155,.9)';g.font='11px system-ui';
  for(let k=0;k<=3;k++){const y=T+H*k/3;g.beginPath();g.moveTo(L,y);g.lineTo(L+W,y);g.stroke();g.fillText((mx-(mx-mn)*k/3).toFixed(2),L+W+6,y+4)}
  const grad=g.createLinearGradient(0,T,0,T+H);grad.addColorStop(0,col+'55');grad.addColorStop(1,col+'00');
  g.beginPath();v.forEach((x,i)=>i?g.lineTo(X(i),Y(x)):g.moveTo(X(i),Y(x)));
  g.strokeStyle=col;g.lineWidth=2;g.stroke();
  g.lineTo(X(v.length-1),T+H);g.lineTo(X(0),T+H);g.closePath();g.fillStyle=grad;g.fill();
  const span=(v.length-1)*s.step;const lbl=span>=3600?(span/3600).toFixed(1)+' jam':Math.round(span/60)+' menit';
  g.fillStyle='rgba(128,138,155,.9)';g.fillText('−'+lbl,L,h-4);g.fillText('sekarang',L+W-40,h-4);
  let info='Rentang '+lbl+' · tertinggi '+money(Math.max(...v))+' · terendah '+money(Math.min(...v));
  if(hover!==undefined){const i=Math.max(0,Math.min(v.length-1,Math.round((hover-L)/W*(v.length-1))));
    g.strokeStyle='rgba(128,138,155,.6)';g.beginPath();g.moveTo(X(i),T);g.lineTo(X(i),T+H);g.stroke();
    g.fillStyle=col;g.beginPath();g.arc(X(i),Y(v[i]),4,0,7);g.fill();
    const ago=(v.length-1-i)*s.step;info=money(v[i])+' · '+(ago===0?'sekarang':(ago>=3600?(ago/3600).toFixed(1)+' jam':Math.round(ago/60)+' menit')+' lalu')}
  $('#cvInfo').textContent=info}

function close(){st.open=null;st.detail=null;$('#ov').classList.remove('show')}
$('#dX').onclick=close;
$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.range=b.dataset.r;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('sel',t===b));drawChart()});
const cv=$('#cv');
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();drawChart(e.clientX-r.left)});
cv.addEventListener('pointerleave',()=>drawChart());
$('#q').addEventListener('input',e=>{st.q=e.target.value.trim().toLowerCase();render()});
$('#sort').addEventListener('change',e=>{st.sort=e.target.value;render()});
window.addEventListener('resize',()=>{if(st.open)drawChart()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearTimeout(timer);poll()}});
poll();
})();
</script>
</body>
</html>
